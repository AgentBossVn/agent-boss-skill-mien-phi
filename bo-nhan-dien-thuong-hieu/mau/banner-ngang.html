<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="kho" content="1200x630">
<title>Banner ngang (1200×630)</title>
<!-- SỬA CHỮ: 3 dòng tiêu đề (h1, dòng 1 màu nhấn), câu phụ (.phu), dòng giờ · ngày · hình thức (.gio), dòng web (.cuoi). Trái chữ ~55%, phải hình. -->
{{font.link}}
<style>
  :root{--nen:{{mau.nen}};--chu:{{mau.chu_tren_nen}};--chu-phu:{{mau.chu_phu_tren_nen}};--nhan:{{mau.nhan}};--chu-nhan:{{mau.chu_tren_nhan}};--the:{{mau.the}};--sang:{{mau.nen_sang}};--muc:{{mau.muc}};--muc-phu:{{mau.muc_phu}};--nhan-mo:rgba({{mau.nhan_rgb}},.22);--nut:{{bo_goc.nut}};--card:{{bo_goc.the}};--dam:{{font.dam_tieu_de}};--font:{{font.css}}}
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; background:var(--nen); }
  body { font-family:var(--font); color:var(--chu); position:relative; }
  .glow { position:absolute; left:640px; top:60px; width:520px; height:520px; border-radius:50%;
          background:radial-gradient(circle, var(--nhan-mo) 0, transparent 70%); filter:blur(30px); }
  .hinh { position:absolute; left:700px; top:110px; width:400px; height:410px; object-fit:contain; }
  .trai { position:absolute; left:64px; top:48px; bottom:48px; width:640px; }
  .logo { height:44px; width:auto; max-width:320px; display:block; }
  h1 { margin-top:48px; font-size:60px; white-space:nowrap; font-weight:var(--dam); line-height:1.05; letter-spacing:-.02em; }
  h1 .m { color:var(--nhan); }
  .phu { margin-top:22px; font-size:26px; color:var(--chu-phu); }
  .gio { margin-top:16px; font-size:26px; font-weight:700; }
  .gio i { font-style:normal; color:var(--nhan); margin:0 8px; }
  .cuoi { position:absolute; left:0; bottom:0; font-size:26px; font-weight:700; }
</style></head>
<body>
  <!--HINH--><div class="glow"></div>
  <img class="hinh" src="{{hinh.tep}}" alt=""><!--/HINH-->
  <div class="trai">
    <img class="logo" src="{{logo.tren_nen}}" alt="{{ten}}">
    <h1><span class="m">TIÊU ĐỀ DÒNG 1</span><br>TIÊU ĐỀ DÒNG 2<br>TIÊU ĐỀ DÒNG 3</h1>
    <p class="phu">Một câu phụ giải thích ngắn gọn</p>
    <p class="gio">19:30 <i>·</i> Thứ Năm, 26/11 <i>·</i> Trực tuyến</p>
    <p class="cuoi">{{web}}</p>
  </div>
<script>document.documentElement.style.zoom = Math.min(1, innerWidth / 1200);</script>
</body></html>
