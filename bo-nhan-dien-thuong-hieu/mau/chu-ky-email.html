<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="kho" content="600x200">
<title>Chữ ký email (600×200)</title>
<!-- SỬA CHỮ: họ tên, chức danh, điện thoại, email, web. Chỉ dùng bảng + style gắn thẳng (inline) để thư điện tử hiển thị đúng. -->
{{font.link}}
</head>
<body style="margin:0;padding:0;background:{{mau.nen_sang}};">
<table role="presentation" width="600" height="200" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;height:200px;background:{{mau.nen_sang}};font-family:{{font.css}};">
  <tr>
    <td width="200" align="center" valign="middle" style="width:200px;padding:0 24px;"><img src="{{logo.vuong}}" alt="{{ten}}" width="120" style="display:block;width:120px;height:auto;max-height:120px;border:0;"></td>
    <td width="4" style="width:4px;background:{{mau.nhan}};font-size:0;line-height:0;">&nbsp;</td>
    <td valign="middle" style="padding:0 0 0 28px;color:{{mau.muc}};">
      <div style="font-size:22px;font-weight:700;color:{{mau.nen}};line-height:1.3;">Họ và tên</div>
      <div style="font-size:15px;color:{{mau.muc_phu}};line-height:1.5;margin-bottom:10px;">Chức danh · {{ten}}</div>
      <div style="font-size:15px;color:{{mau.muc}};line-height:1.6;">0900 000 000 <span style="color:{{mau.nhan}};">&middot;</span> ten@congty.vn</div>
      <div style="font-size:15px;font-weight:700;color:{{mau.nen}};line-height:1.6;">{{web}}</div>
    </td>
  </tr>
</table>
</body></html>
